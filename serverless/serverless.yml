service: fe-serverless
frameworkVersion: '3'

plugins:
  - serverless-esbuild
  - serverless-iam-roles-per-function

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 15
  logRetentionInDays: 7
  tags:
    Project: facturacion-serverless
    Env: ${self:provider.stage}
    ManagedBy: serverless
  # Los recursos de datos los crea Terraform; aquí solo se reciben sus nombres.
  environment:
    EMISOR_RUC: ${param:emisorRuc, '20000000001'}
    EMISOR_RAZON_SOCIAL: ${param:emisorRazonSocial, 'EMPRESA DEMO S.A.C.'}
    DYNAMODB_TABLE: fe-${self:provider.stage}-comprobantes
    S3_BUCKET: fe-${self:provider.stage}-comprobantes-${aws:accountId}
    SSM_CERTIFICADO: /facturacion/${self:provider.stage}/certificado
    SSM_LLAVE_PRIVADA: /facturacion/${self:provider.stage}/llave-privada

package:
  individually: true

# esbuild une cada handler con el código que usa (incluso el de ../api y ../sunat-mock) en un solo archivo.
custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    platform: node
    target: node22
    exclude:
      - '@aws-sdk/*'

functions:
  hola:
    handler: src/hola.handler
    description: Función de prueba de la Fase 1 (se elimina al terminar la Fase 3)

  sunat-mock:
    handler: src/sunat-mock.handler
    description: SUNAT simulada (SOAP sendBill) para las pruebas
    memorySize: 512
    timeout: 20
    # URL pública de la función; el acceso lo controlan las credenciales SOL, igual que en SUNAT
    url: true
    environment:
      SUNAT_USUARIO: ${param:sunatUsuario, 'MODDATOS'}
      SUNAT_CLAVE: ${param:sunatClave, 'moddatos'}
      RUCS_INACTIVOS: ${param:rucsInactivos, '20123456786'}

resources:
  Resources:
    # Desde 2025 una URL de función pública necesita también este permiso; Serverless v3 solo crea InvokeFunctionUrl.
    SunatMockInvokeFunctionPermission:
      Type: AWS::Lambda::Permission
      DependsOn: SunatDashmockLambdaFunction
      Properties:
        FunctionName: !GetAtt SunatDashmockLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: '*'
        InvokedViaFunctionUrl: true
